<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Kodil Makan Ikan - Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffecd2;font-family:system-ui;overflow:hidden}
#wrap{max-width:480px;margin:0 auto;height:100vh;position:relative;background:linear-gradient(#a8edea,#fed6e3);display:flex;flex-direction:column}
#top{padding:10px;display:flex;justify-content:space-between}
.b{background:#fff;border-radius:20px;padding:8px 14px;font-weight:800;border:2px solid #ff7043}
canvas{flex:1;width:100%;background:linear-gradient(#b2dfdb,#ffe0b2)}
#ctrl{height:120px;display:grid;grid-template-columns:1fr 70px 1fr;gap:6px;padding:8px;background:#fff8e1}
.cbtn{background:#fff;border:3px solid #ff7043;border-radius:15px;font-size:22px;display:flex;align-items:center;justify-content:center}
#start{position:absolute;inset:0;background:rgba(255,243,224,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
h1{font-size:32px;color:#e64a19}
#play{background:#ff5722;color:#fff;border:none;padding:14px 30px;border-radius:30px;font-size:18px;font-weight:900;margin-top:14px}
</style>
</head>
<body>
<div id="wrap">
<div id="top"><div class="b">🐟 <span id="sc">0</span></div><div class="b">🏠 Rumah Kodil</div><div class="b">⏰ <span id="tm">60</span></div></div>
<canvas id="cv"></canvas>
<div id="ctrl"><div></div><button class="cbtn" id="up">⬆️</button><div></div><button class="cbtn" id="lf">⬅️</button><button class="cbtn" id="dn">⬇️</button><button class="cbtn" id="rt">➡️</button></div>
<div id="start"><div style="font-size:70px">🐱</div><h1>KODIL<br>MAKAN IKAN!</h1><p>🎵 Ada musik & suara meong!</p><button id="play">MEONG! MAIN!</button></div>
</div>
<script>
let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W,H,cat,fish=[],par=[],keys={},score=0,time=60,active=false,last=0,aCtx;
function initA(){aCtx=new(window.AudioContext||window.webkitAudioContext)()}
function meow(){if(!aCtx)return;let o=aCtx.createOscillator(),g=aCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(500,aCtx.currentTime);o.frequency.linearRampToValueAtTime(800,aCtx.currentTime+0.15);o.frequency.linearRampToValueAtTime(250,aCtx.currentTime+0.45);g.gain.setValueAtTime(.6,aCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,aCtx.currentTime+.45);o.connect(g);g.connect(aCtx.destination);o.start();o.stop(aCtx.currentTime+.5)}
function pop(){if(!aCtx)return;let o=aCtx.createOscillator(),g=aCtx.createGain();o.frequency.value=1000;g.gain.setValueAtTime(.3,aCtx.currentTime);g.gain.linearRampToValueAtTime(0,aCtx.currentTime+.15);o.connect(g);g.connect(aCtx.destination);o.start();o.stop(aCtx.currentTime+.15)}
function resize(){let r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;W=r.width;H=r.height;ctx.setTransform(2,0,0,2,0,0)}
function reset(){cat={x:W/2,y:H/2,vx:0,vy:0,s:32,sp:4.5};fish=[];par=[];score=0;time=60;for(let i=0;i<6;i++)spawn()}
function spawn(){fish.push({x:Math.random()*(W-60)+30,y:Math.random()*(H-100)+40,s:18+Math.random()*12,w:Math.random()*6.28,t:Math.random()>.85?'gold':'norm'})}
function upd(){if(!active)return;if(keys.l)cat.vx=-cat.sp;else if(keys.r)cat.vx=cat.sp;else cat.vx*=0.82;if(keys.u)cat.vy=-cat.sp;else if(keys.d)cat.vy=cat.sp;else cat.vy*=0.82;cat.x+=cat.vx;cat.y+=cat.vy;cat.x=Math.max(20,Math.min(W-20,cat.x));cat.y=Math.max(20,Math.min(H-20,cat.y));fish.forEach((f,i)=>{f.w+=0.12;f.y+=Math.sin(f.w)*0.6;let dx=cat.x-f.x,dy=cat.y-f.y;if(Math.hypot(dx,dy)<cat.s){fish.splice(i,1);score+=(f.t=='gold'?5:1);document.getElementById('sc').textContent=score;pop();setTimeout(meow,80);for(let k=0;k<7;k++)par.push({x:f.x,y:f.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:18});spawn()}});par.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0)par.splice(i,1)});if(Date.now()-last>1000){time--;document.getElementById('tm').textContent=time;last=Date.now();if(time<=0)end()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(255,183,77,.25)';ctx.fillRect(W-90,10,80,60);ctx.fillStyle='#5d4037';ctx.font='bold 11px system-ui';ctx.fillText('RUMAH',W-80,85);fish.forEach(f=>{ctx.save();ctx.translate(f.x,f.y);ctx.font=f.s+'px serif';ctx.fillText(f.t=='gold'?'🐟✨':'🐟',0,0);ctx.restore()});par.forEach(p=>{ctx.fillStyle=`rgba(255,87,34,${p.l/18})`;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.28);ctx.fill()});ctx.save();ctx.translate(cat.x,cat.y);ctx.font=cat.s+'px serif';ctx.textAlign='center';ctx.fillText(Math.hypot(cat.vx,cat.vy)>1?'🐈':'🐱',0,0);ctx.restore();if(active)requestAnimationFrame(()=>{upd();draw()})}
function end(){active=false;meow();let st=document.getElementById('start');st.style.display='flex';st.innerHTML=`<div style="font-size:60px">${score>20?'😻':'🐱'}</div><h1>${score>20?'KENYANG!':'HABIS'}</h1><p style="font-size:24px;font-weight:900;color:#e64a19">🐟 ${score} ikan</p><button id="play" onclick="location.reload()">MAIN LAGI</button>`}
window.addEventListener('resize',()=>{resize();draw()});resize();reset();
function k(s,v){keys[s]=v}
['lf','rt','up','dn'].forEach(id=>{let el=document.getElementById(id),m={lf:'l',rt:'r',up:'u',dn:'d'};el.addEventListener('touchstart',e=>{e.preventDefault();k(m[id],true)});el.addEventListener('touchend',e=>{e.preventDefault();k(m[id],false)});el.addEventListener('mousedown',()=>k(m[id],true));el.addEventListener('mouseup',()=>k(m[id],false))});
let sx,sy;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});cv.addEventListener('touchmove',e=>{e.preventDefault();let dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;k('l',dx<-15);k('r',dx>15);k('u',dy<-15);k('d',dy>15)},{passive:false});cv.addEventListener('touchend',()=>keys={});
document.getElementById('play').addEventListener('click',()=>{initA();document.getElementById('start').style.display='none';active=true;last=Date.now();meow();draw()});draw();
</script>
</body>
</html>￼Enter
